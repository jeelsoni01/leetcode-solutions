name: Update LeetCode README

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README
        run: |
          python scripts/update_readme.py

          echo "======================================"
          echo "        README MARKER CHECK"
          echo "======================================"

          grep -n "STATS_START\|STATS_END\|PROBLEMS_START\|PROBLEMS_END" README.md || true

          echo "======================================"
          echo "        GIT CHANGE CHECK"
          echo "======================================"

          git status --short

          echo "======================================"

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes detected."
          else
            git commit -m "docs: update LeetCode progress"
            git push
          fi
